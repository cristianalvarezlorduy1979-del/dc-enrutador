version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    restart: always
    environment:
      MONGO_INITDB_DATABASE: enrutador
    volumes:
      - mongo_data:/data/db
    networks:
      - enrutador-net

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    depends_on:
      - mongodb
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/enrutador
      DB_NAME: enrutador
      MASTER_EMAIL: dcasesorias@gmail.com
      DEFAULT_MASTER_PASS: admin12345
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - enrutador-net

volumes:
  mongo_data:
    driver: local

networks:
  enrutador-net:
    driver: bridge
